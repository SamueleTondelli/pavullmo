[project]
name = "pavullmo"
version = "0.1.0"
description = "A small decoder-only language model for Italian"
authors = [
    { name = "SamueleTondelli", email = "samueletondelli92@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets<4.0.0",
    "sentencepiece>=0.2.2",
    "tensorboard==2.21.0",
    "torch==2.9.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
cloud = [
    "modal>=1.5,<2",
]

[project.scripts]
pavullmo = "pavullmo:main"
pavullmo-check = "pavullmo.check_environment:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
