[project]
name = "pavullmo"
version = "0.1.0"
description = "A small decoder-only language model for Italian"
authors = [
    { name = "SamueleTondelli", email = "samueletondelli92@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "causal-conv1d==1.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "datasets<4.0.0",
    "duckdb>=1.5.5",
    "huggingface-hub>=0.35,<2",
    "matplotlib>=3.11.1",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "tensorboard==2.21.0",
    "torch==2.9.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
cloud = [
    "modal>=1.5,<2",
]

[project.scripts]
pavullmo = "pavullmo:main"
pavullmo-check = "pavullmo.check_environment:main"

[tool.uv.sources]
# Match Python 3.12, torch 2.9.1+cu128, and PyTorch's C++11 ABI. Using the
# published wheel also permits Modal image builds without a CUDA toolkit.
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
