# Winning 35M ICL-maxxing recipe (4x112 GQA-2, 12 blocks, RoPE 50k, Muon/AdamW + Emb WD, WSD-40%, EMA 0.9995).
# Partial preset: provide name and explicit data paths in your run config or --override.

[model]
vocab_size = 16384
n_blocks = 12
embed_dim = 448
attn_heads = 4
num_kv_heads = 2
ffn_dim = 1216
seq_len = 1024
rope_base = 50000.0
initialization = "gpt_scaled"
initialization_std = 0.02
qk_norm = true
split_qkv_projections = true
canon_layers = false
dropout = 0.0

[optimizer]
lr = 0.003
kind = "muon_adamw"

[optimizer.schedule]
min_lr = 0.0
kind = "wsd"
decay_fraction = 0.4
warmup_steps = 219

[optimizer.muon]
lr_multiplier = 0.5
weight_decay = 0.1
momentum = 0.95
nesterov = true
ns_iters = 5

[optimizer.adamw]
beta1 = 0.9
beta2 = 0.99
eps = 1e-08
weight_decay = 0.02
embedding_weight_decay = true

[training]
batch_size = 16
grad_accum_steps = 1
max_grad_norm = 1.0
z_loss_coefficient = 0.0
ema_decay = 0.9995
ema_warmup = true

[evaluation]
interval_steps = 500
steps = 7

[logging]
diagnostics_interval = 100

[checkpoint]
save_pre_decay = true
keep_last = 2
